[workspace]
members = [
  "crates/*",
  "xtask"
]
default-members = ["crates/*"]
resolver = "2"

[profile.release]
lto = true

[workspace.package]
version = "0.45.3"
authors = ["Herrington Darkholme <2883231+HerringtonDarkholme@users.noreply.github.com>"]
edition = "2024"
license = "MIT"
documentation = "https://ast-grep.github.io/guide/introduction.html"
homepage = "https://ast-grep.github.io/"
repository = "https://github.com/ast-grep/ast-grep"
rust-version = "1.88.0"
readme = "README.md"

[workspace.dependencies]
ast-grep-core = { path = "crates/core", version = "0.45.3", default-features = false }
ast-grep-config = { path = "crates/config", version = "0.45.3" }
ast-grep-dynamic = { path = "crates/dynamic", version = "0.45.3" }
ast-grep-language = { path = "crates/language", version = "0.45.3" }
ast-grep-lsp = { path = "crates/lsp", version = "0.45.3" }
ast-grep-outline = { path = "crates/outline", version = "0.45.3" }

bit-set = { version = "0.11.0" }
ignore = { version = "0.4.22" }
regex = { version = "1.10.4" }
serde = { version = "1.0.200", features = ["derive"] }
serde_regex = "1.2.0"
serde_yaml = "0.9.33"
tree-sitter = { version = "0.27.0" }
thiserror = "2.0.0"
schemars = "1.0.0"
anyhow = "1.0.82"
dashmap = "6.0.0"

# The C++ grammar of `crates/language` is the GrigoryEvko fork at ABI 1019. A runtime of the published
# project reads a maximum of ABI 15 and refuses that grammar. So every crate that asks crates.io for
# tree-sitter gets the fork runtime instead. The fork is version 0.27.0, so it meets the `0.27.0`
# requirement of the workspace. `tree-sitter-language` comes from the same commit, because the runtime
# takes it from its own workspace and a grammar crate takes it from crates.io, and the two copies
# declare the same `links` value.
[patch.crates-io]
tree-sitter = { git = "https://github.com/GrigoryEvko/tree-sitter", rev = "31a914d29f8e909125df50f82512bf6477097568" }
tree-sitter-language = { git = "https://github.com/GrigoryEvko/tree-sitter", rev = "31a914d29f8e909125df50f82512bf6477097568" }
